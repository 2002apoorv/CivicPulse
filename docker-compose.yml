version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: civicpulse-db
    restart: always
    environment:
      POSTGRES_DB: civicpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civicpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: civicpulse-backend
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/civicpulse
      - VECTOR_STORE_BACKEND=pgvector
      - ENVIRONMENT=production
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: civicpulse-frontend
    restart: on-failure
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
